# Sets default memory used for gradle commands. Required for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Shared environment (both subprojects target the same MC/Forge/mappings)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Shared dependency mod versions (Minecraft 1.20.1 / Forge)
# MineColonies family (LDTTeam jfrog maven: https://ldtteam.jfrog.io/ldtteam/modding/)
minecolonies_version=1.20.1-1.1.1231
structurize_version=1.20.1-1.0.816
blockui_version=1.20.1-1.0.194
domum_ornamentum_version=1.20.1-1.0.296
# TerraFirmaCraft (CurseMaven, project 302973) + its mandatory dep Patchouli (project 306770).
# Format: curse.maven:<slug>-<projectId>:<fileId>
tfc_file_id=6990923
patchouli_file_id=4966125
# EMI (CurseMaven project 580555) - recipe/item viewer used only in dev runs for testing.
emi_file_id=6420945
# SlimColonies (CurseMaven project 1353551) - MineColonies fork; :replacements' optional integration
# compiles against it (compileOnly only - never bundled, never mandatory). File id = 1.20.1-17.4.1.
slimcolonies_file_id=7847939

# Per-mod identity (id/name/version/group) is defined in each subproject's build.gradle,
# not here, so the two mods don't share a single mod_id.
