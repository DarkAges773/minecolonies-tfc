# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Shared environment (NeoForge 1.21.1 branch — see docs/porting-1.21.1-neoforge.md)
## No mapping_channel/mapping_version: NeoForge runs Mojang ("official") mappings in dev AND in
## production, so there is no reobf step and mixins need no refmap.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
# The loader dependency range declared in neoforge.mods.toml (NeoForge's own major version).
neoforge_version_range=[21.1.0,)
# javafml loader version range — NeoForge 21.1's javafml is 4.x.
loader_version_range=[4,)

## Shared dependency mod versions (Minecraft 1.21.1 / NeoForge)
# MineColonies family (LDTTeam jfrog maven: https://ldtteam.jfrog.io/ldtteam/modding/).
# NOTE: on 1.21.1 LDTTeam publishes under the REVERSED scheme <modver>-<mcver>. The older
# <mcver>-<modver> "beta" line (e.g. structurize 1.21.1-1.0.746-beta) is stale/abandoned — do NOT
# use it. Also note the artifactId rename: domum_ornamentum (underscore, 1.20.1) ->
# domum-ornamentum (hyphen, 1.21.1).
#
# DANGER — the two schemes sort against each other and the OLD one always wins. Gradle compares
# version parts left to right, so "1.21.1-1.0.200-BETA" > "1.0.223-snapshot" (21 > 0 at part 2).
# A leftover old-scheme pin therefore silently DOWNGRADES the module below what MineColonies needs
# and beats its transitive requirement without any conflict warning. That is exactly what happened
# with domum-ornamentum: the 1.0.200-BETA jar (built 2024-08-12) lacks DynamicTimberFrameBlock,
# which MineColonies 1.21.1 references, so placing a hut crashed with NoClassDefFoundError.
# Keep every LDTTeam pin on the <modver>-<mcver> / bare-<modver> scheme.
#
# domum-ornamentum dropped the mc suffix entirely and publishes its mod jar under a `main`
# classifier (there is no plain domum-ornamentum-<ver>.jar) — resolution works because it also
# publishes Gradle module metadata (.module), which maps to the right variant automatically.
# These are FLOORS, not necessarily what loads: MineColonies' own transitive requirements can pull a
# module up (Gradle resolves conflicts to the highest version). Today `structurize` actually resolves to
# 1.0.832-1.21.1-snapshot because MineColonies 1.1.1368 asks for it — verify with
#   gradlew :replacements:dependencies --configuration runtimeClasspath
# before assuming the numbers below are what the game runs.
minecolonies_version=1.1.1368-1.21.1
structurize_version=1.0.830-1.21.1
blockui_version=1.0.209-1.21.1
domum_ornamentum_version=1.0.231

# MixinExtras is NOT declared here: NeoForge 21.1.248 depends on io.github.llamalad7:mixinextras-neoforge
# 0.5.3, so its annotations arrive transitively on the compile classpath (and at runtime) with no pin
# of ours. Mixin itself is net.fabricmc:sponge-mixin 0.15.2+mixin.0.8.7 (=> compatibilityLevel JAVA_21 ok).

# Dropped on this branch (no 1.21.1 build published):
#  - EMI (dev-run-only recipe viewer) — re-add a curse.maven file id if a 1.21.1 build appears.
#  - SlimColonies (1.20.1 only) — its integration sources stay on disk for cherry-pick parity with
#    main but are excluded from the source set and its mixin config is not registered. See
#    replacements/build.gradle.
# TerraFirmaCraft/Patchouli are not listed yet — they're :compat's deps, scouted when :compat is ported.

# Per-mod identity (id/name/version/group) is defined in each subproject's build.gradle,
# not here, so the mods don't share a single mod_id.
