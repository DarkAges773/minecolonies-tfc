// Standalone Structurize block-substitution mod. Depends ONLY on Structurize — no MineColonies, no TFC.
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

apply plugin: 'org.spongepowered.mixin'

def mod_id = 'structurizereplacements'
def mod_name = 'Palette Swap for MineColonies'
def mod_license = 'GPL-3.0'
def mod_version = '0.1.0'
def mod_group_id = 'com.structurizereplacements'
def mod_authors = 'DarkAges'
def mod_description = 'Tag- and family-based block substitution for Structurize blueprints. Standalone; only requires Structurize.'

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    // Standalone runs: load ONLY this mod (+ Structurize/BlockUI from the deobf deps below).
    // No MineColonies/TFC here - this proves the mod works independently and is faster to launch.
    // The full stack (both our mods + MC/TFC) is run from :compat instead.
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Structurize is the only mandatory mod dependency. BlockUI is Structurize's GUI library — needed at
    // compile time too since we build BlockUI windows / buttons.
    implementation fg.deobf("com.ldtteam:structurize:${structurize_version}")
    implementation fg.deobf("com.ldtteam:blockui:${blockui_version}")

    // MineColonies is an OPTIONAL dependency (mods.toml: mandatory=false). The optional integration
    // (com.structurizereplacements.integration.minecolonies.* + the .minecolonies.mixins.json config)
    // compiles against it, but those classes/mixins only load when MineColonies is actually present.
    // compileOnly so it isn't bundled; runtimeOnly so the dev runClient loads it and exercises the
    // integration (Domum Ornamentum is MineColonies' mandatory dep). Remove the runtimeOnly lines to
    // dev-test the MineColonies-absent (pure standalone) path.
    compileOnly fg.deobf("com.ldtteam:minecolonies:${minecolonies_version}")
    runtimeOnly fg.deobf("com.ldtteam:minecolonies:${minecolonies_version}")
    // NOTE: Domum Ornamentum is a MANDATORY dependency of Structurize itself (not just MineColonies), so it
    // must stay even in a MineColonies-absent run — removing it crashes Structurize at load. (To dev-test
    // the MineColonies-absent path, comment out only the runtimeOnly minecolonies line above.)
    // compileOnly too: DomumMaterialRewriter substitutes the material(s) stored in DO "materialized" blocks'
    // textureData NBT (panel/brick/framed/...). DO is always present at runtime, so no load guard is needed.
    compileOnly fg.deobf("com.ldtteam:domum_ornamentum:${domum_ornamentum_version}")
    runtimeOnly fg.deobf("com.ldtteam:domum_ornamentum:${domum_ornamentum_version}")
    // Dev-run-only recipe viewer.
    runtimeOnly fg.deobf("curse.maven:emi-580555:${emi_file_id}")
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Optional MineColonies-integration mixins (config is required:false; Mixin skips them when the
    // MineColonies target classes are absent).
    config "${mod_id}.minecolonies.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json,${mod_id}.minecolonies.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
