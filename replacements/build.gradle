// Standalone Structurize block-substitution mod. Depends ONLY on Structurize — no MineColonies, no TFC.
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

apply plugin: 'org.spongepowered.mixin'

def mod_id = 'structurizereplacements'
def mod_name = 'Palette Swap for MineColonies'
def mod_license = 'GPL-3.0'
// MAJOR.MINOR — bump manually (MINOR = new back-compat feature, MAJOR = rule-schema/NBT break).
def mod_version_base = '0.2'
// PATCH auto-rolls from the count of commits that touched this subproject (see rootProject.gitBuildNumber)
// — the rolling "build number", advancing only when this mod changes.
def mod_version = "${mod_version_base}.${rootProject.gitBuildNumber(projectDir.name)}".toString()
def mod_group_id = 'com.structurizereplacements'
def mod_authors = 'DarkAges'
def mod_description = 'Tag- and family-based block substitution for Structurize blueprints. Standalone; only requires Structurize.'

// Released as <mcversion>-<semver> (e.g. 1.20.1-0.1.0), matching the MineColonies/Structurize ecosystem.
// mod_version stays the plain SemVer; the MC prefix comes from the shared minecraft_version property and
// continues across MC ports. Bump rules: PATCH=fixes, MINOR=back-compat features, MAJOR=rule-schema/NBT break.
def full_version = "${minecraft_version}-${mod_version}".toString()
version = full_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    // Standalone runs: load ONLY this mod (+ Structurize/BlockUI from the deobf deps below).
    // No MineColonies/TFC here - this proves the mod works independently and is faster to launch.
    // The full stack (both our mods + MC/TFC) is run from :compat instead.
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            // Own working dir so client + server can run simultaneously (shared run/ collides on the
            // logs/latest.log file lock on Windows). run-server/eula.txt + server.properties
            // (online-mode=false for the offline Dev account) are pre-created, not generated.
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Structurize is the only mandatory mod dependency. BlockUI is Structurize's GUI library — needed at
    // compile time too since we build BlockUI windows / buttons.
    implementation fg.deobf("com.ldtteam:structurize:${structurize_version}")
    implementation fg.deobf("com.ldtteam:blockui:${blockui_version}")

    // The colony mods are OPTIONAL dependencies (mods.toml: mandatory=false). The optional integration
    // (shared logic in integration.colony + a per-fork bridge and mixin config) compiles against BOTH
    // forks (compileOnly — never bundled); those classes/mixins only load when the matching mod is present.
    compileOnly fg.deobf("com.ldtteam:minecolonies:${minecolonies_version}")
    // SlimColonies: a MineColonies fork, repackaged to no.monopixel.slimcolonies.*.
    compileOnly fg.deobf("curse.maven:slimcolonies-1353551:${slimcolonies_file_id}")
    // The dev runClient loads exactly ONE colony mod (they can't coexist at runtime), selected via
    //   gradlew :replacements:runClient -PcolonyMod=minecolonies|slim|none
    // default = minecolonies; 'none' dev-tests the colony-mod-absent (pure standalone) path.
    // (Domum Ornamentum below stays in all cases — it's a mandatory dep of Structurize itself.)
    def colonyMod = providers.gradleProperty('colonyMod').getOrElse('minecolonies')
    if (colonyMod == 'slim' || colonyMod == 'slimcolonies') {
        runtimeOnly fg.deobf("curse.maven:slimcolonies-1353551:${slimcolonies_file_id}")
    } else if (colonyMod != 'none') {
        runtimeOnly fg.deobf("com.ldtteam:minecolonies:${minecolonies_version}")
    }
    // NOTE: Domum Ornamentum is a MANDATORY dependency of Structurize itself (not just MineColonies), so it
    // must stay even in a MineColonies-absent run — removing it crashes Structurize at load. (To dev-test
    // the MineColonies-absent path, comment out only the runtimeOnly minecolonies line above.)
    // compileOnly too: DomumMaterialRewriter substitutes the material(s) stored in DO "materialized" blocks'
    // textureData NBT (panel/brick/framed/...). DO is always present at runtime, so no load guard is needed.
    compileOnly fg.deobf("com.ldtteam:domum_ornamentum:${domum_ornamentum_version}")
    runtimeOnly fg.deobf("com.ldtteam:domum_ornamentum:${domum_ornamentum_version}")
    // Dev-run-only recipe viewer.
    runtimeOnly fg.deobf("curse.maven:emi-580555:${emi_file_id}")
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Optional MineColonies-integration mixins (config is required:false; Mixin skips them when the
    // MineColonies target classes are absent).
    config "${mod_id}.minecolonies.mixins.json"
    // Same pattern for the SlimColonies fork (no.monopixel.slimcolonies.* targets).
    config "${mod_id}.slimcolonies.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: full_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json,${mod_id}.minecolonies.mixins.json,${mod_id}.slimcolonies.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Cut a release in CHANGELOG.md: rename the curated '## [Unreleased]' section to a dated section for the
// current version (mod_version, e.g. 0.1.33) and leave a fresh empty '## [Unreleased]' on top. Run
// intentionally at release time (`./gradlew :replacements:cutRelease`), then commit the changelog. Refuses
// when [Unreleased] is empty so we never stamp an empty release.
tasks.register('cutRelease') {
    group = 'release'
    description = "Move CHANGELOG [Unreleased] into a dated section for version ${mod_version}."
    doLast {
        def changelog = file('CHANGELOG.md')
        if (!changelog.exists()) {
            throw new GradleException("No CHANGELOG.md in ${projectDir}")
        }
        def text = changelog.text
        def marker = '## [Unreleased]'
        def idx = text.indexOf(marker)
        if (idx < 0) {
            throw new GradleException("No '${marker}' section in CHANGELOG.md")
        }
        def afterMarker = idx + marker.length()
        def nextHeader = text.indexOf('\n## [', afterMarker)
        def body = (nextHeader < 0 ? text.substring(afterMarker) : text.substring(afterMarker, nextHeader)).trim()
        if (body.isEmpty()) {
            throw new GradleException("CHANGELOG [Unreleased] is empty - nothing to release.")
        }
        def date = new Date().format('yyyy-MM-dd')
        changelog.text = text.substring(0, idx) + "${marker}\n\n## [${mod_version}] - ${date}" + text.substring(afterMarker)
        println "Cut ${mod_id} release ${mod_version} (${date}) in CHANGELOG.md"
    }
}
