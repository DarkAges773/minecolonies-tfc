// Standalone Structurize block-substitution mod. Depends ONLY on Structurize — no MineColonies, no TFC.
// NeoForge 1.21.1 build, driven by ModDevGradle (MDG). Differences from the 1.20.1-Forge branch worth
// knowing before editing this file:
//   * No MixinGradle, no refmap, no reobf. NeoForge runs Mojang mappings in dev AND production, so mixins
//     reference the same names everywhere. Mixin configs are declared in neoforge.mods.toml ([[mixins]]),
//     NOT in a `MixinConfigs` jar-manifest attribute.
//   * Third-party mods ship Mojmap-mapped, so they're plain `implementation`/`compileOnly` dependencies —
//     there is no `fg.deobf(...)` wrapper.
//   * Run configs come from `neoForge { runs { } }`; the mods loaded into them from `neoForge { mods { } }`.
plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev'
}

def mod_id = 'structurizereplacements'
def mod_name = 'Palette Swap for MineColonies'
def mod_license = 'GPL-3.0'
// MAJOR.MINOR — bump manually (MINOR = new back-compat feature, MAJOR = rule-schema/NBT break).
def mod_version_base = '0.4'
// PATCH auto-rolls from the count of commits that touched this subproject (see rootProject.gitBuildNumber)
// — the rolling "build number", advancing only when this mod changes.
def mod_version = "${mod_version_base}.${rootProject.gitBuildNumber(projectDir.name)}".toString()
def mod_group_id = 'com.structurizereplacements'
def mod_authors = 'DarkAges'
def mod_description = 'Tag- and family-based block substitution for Structurize blueprints. Standalone; only requires Structurize.'

// Released as <mcversion>-<semver> (e.g. 1.21.1-0.4.0), matching the MineColonies/Structurize ecosystem.
// mod_version stays the plain SemVer; the MC prefix comes from the shared minecraft_version property, so
// this branch's jars are 1.21.1-* automatically. Bump rules: PATCH=fixes, MINOR=back-compat features,
// MAJOR=rule-schema/NBT break.
def full_version = "${minecraft_version}-${mod_version}".toString()
version = full_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// SlimColonies (a MineColonies fork) has NO 1.21.1 build — every published file is 1.20.1 — so we can't
// compile against it here. Its integration is PARKED, not deleted: the sources stay on disk so the file
// layout matches the 1.20.1 branch and cherry-picks apply cleanly, but they're excluded from the source
// set and its mixin config is left out of the jar / unregistered in neoforge.mods.toml. To revive it if
// SlimColonies ever ships 1.21.1: drop these excludes, restore the compileOnly/runtimeOnly coordinates,
// re-add the [[mixins]] entry + the optional dependency in neoforge.mods.toml, and restore the
// SlimColoniesBridge branch in StructurizeReplacements.
sourceSets.main.java {
    exclude 'com/structurizereplacements/integration/slimcolonies/**'
    exclude 'com/structurizereplacements/mixin/slimcolonies/**'
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude "${mod_id}.slimcolonies.mixins.json"
}

neoForge {
    version = neoforge_version

    // Which source sets are treated as this mod in dev runs (MDG's replacement for FG's `mods { source }`).
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Standalone runs: load ONLY this mod (+ Structurize/BlockUI/Domum from the deps below). No TFC here —
    // this proves the mod works independently and is faster to launch. The full stack is run from :compat
    // once that subproject is ported.
    runs {
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            // Own working dir so client + server can run simultaneously (a shared run/ collides on the
            // logs/latest.log file lock on Windows). run-server/eula.txt + server.properties
            // (online-mode=false for the offline Dev account) are pre-created, not generated.
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
}

dependencies {
    // Structurize is the only mandatory mod dependency. BlockUI is Structurize's GUI library — needed at
    // compile time too since we build BlockUI windows / buttons.
    implementation "com.ldtteam:structurize:${structurize_version}"
    implementation "com.ldtteam:blockui:${blockui_version}"

    // MineColonies is an OPTIONAL dependency (neoforge.mods.toml: type="optional"). The optional
    // integration (shared logic in integration.colony + the per-fork bridge and mixin config) compiles
    // against it but is never bundled; those classes/mixins only load when MineColonies is present.
    compileOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    // The dev runClient loads MineColonies unless you opt out:
    //   gradlew :replacements:runClient -PcolonyMod=minecolonies|none
    // default = minecolonies; 'none' dev-tests the colony-mod-absent (pure standalone) path.
    // (No 'slim' option on this branch — SlimColonies has no 1.21.1 build; see the parking note above.)
    // NOTE: Domum Ornamentum below stays in ALL cases — it's a mandatory dependency of Structurize itself,
    // not just of MineColonies, so removing it crashes Structurize at load with a misleading
    // "mixin config could not be read" error.
    def colonyMod = providers.gradleProperty('colonyMod').getOrElse('minecolonies')
    if (colonyMod != 'none') {
        runtimeOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    }
    // compileOnly too: DomumMaterialRewriter substitutes the material(s) stored in DO "materialized" blocks'
    // textureData NBT (panel/brick/framed/...). DO is always present at runtime, so no load guard is needed.
    // Artifact id is HYPHENATED on 1.21.1 (was domum_ornamentum with an underscore on 1.20.1).
    // The version MUST stay >= what MineColonies requires: it calls into DO classes directly (e.g.
    // DynamicTimberFrameBlock from DoBlockPlacementHandler), so an older DO crashes with
    // NoClassDefFoundError the moment a hut's material list is computed. See gradle.properties.
    compileOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"
    runtimeOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"

    // MixinExtras (@WrapOperation/@ModifyExpressionValue/@Local/...) needs no declaration here: NeoForge
    // depends on mixinextras-neoforge, so its annotations are already on the compile + runtime classpath.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: full_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // PORT: javac stops listing after 100 errors by default, which hides the tail of a migration pass.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// Cut a release in CHANGELOG.md: rename the curated '## [Unreleased]' section to a dated section for the
// current version (mod_version, e.g. 0.4.0) and leave a fresh empty '## [Unreleased]' on top. Run
// intentionally at release time (`./gradlew :replacements:cutRelease`), then commit the changelog. Refuses
// when [Unreleased] is empty so we never stamp an empty release.
tasks.register('cutRelease') {
    group = 'release'
    description = "Move CHANGELOG [Unreleased] into a dated section for version ${mod_version}."
    doLast {
        def changelog = file('CHANGELOG.md')
        if (!changelog.exists()) {
            throw new GradleException("No CHANGELOG.md in ${projectDir}")
        }
        def text = changelog.text
        def marker = '## [Unreleased]'
        def idx = text.indexOf(marker)
        if (idx < 0) {
            throw new GradleException("No '${marker}' section in CHANGELOG.md")
        }
        def afterMarker = idx + marker.length()
        def nextHeader = text.indexOf('\n## [', afterMarker)
        def body = (nextHeader < 0 ? text.substring(afterMarker) : text.substring(afterMarker, nextHeader)).trim()
        if (body.isEmpty()) {
            throw new GradleException("CHANGELOG [Unreleased] is empty - nothing to release.")
        }
        def date = new Date().format('yyyy-MM-dd')
        changelog.text = text.substring(0, idx) + "${marker}\n\n## [${mod_version}] - ${date}" + text.substring(afterMarker)
        println "Cut ${mod_id} release ${mod_version} (${date}) in CHANGELOG.md"
    }
}
