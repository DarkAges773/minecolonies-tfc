modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# We mixin into Structurize, so we must load AFTER it. MineColonies is an OPTIONAL dependency: when
# present, the builder/Build-Options integration activates; when absent, the mod is a pure Structurize
# substitution add-on.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="structurize"
    mandatory=true
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecolonies"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
