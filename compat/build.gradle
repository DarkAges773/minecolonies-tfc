// MineColonies x TerraFirmaCraft compatibility bridge. Depends on :replacements for the
// block-substitution engine and ships TFC-specific substitution rules as a datapack.
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

// :compat has NO mixins of its own. We apply MixinGradle anyway because the dev run configurations
// live in this project, and applying it here is what makes ForgeGradle inject the runtime refmap
// remapping (mixin.env.remapRefMap / refMapRemappingFile) into those runs. Without it, OTHER mods'
// SRG-named mixins (e.g. Patchouli's AccessorScreen) fail to apply in the official-mapped dev env.
apply plugin: 'org.spongepowered.mixin'

// Needed so the run config below can reference project(':replacements').sourceSets.main.
evaluationDependsOn(':replacements')

def mod_id = 'mctfc'
def mod_name = 'MineColonies x TerraFirmaCraft'
def mod_license = 'GPL-3.0'
// MAJOR.MINOR — bump manually (MINOR = new back-compat feature, MAJOR = rule-schema/NBT break).
def mod_version_base = '0.1'
// PATCH auto-rolls from the count of commits that touched this subproject (see rootProject.gitBuildNumber)
// — the rolling "build number", advancing only when this mod changes.
def mod_version = "${mod_version_base}.${rootProject.gitBuildNumber(projectDir.name)}".toString()
def mod_group_id = 'com.mctfc'
def mod_authors = 'DarkAges'
def mod_description = 'Compatibility bridge between MineColonies and TerraFirmaCraft for Forge 1.20.1.'

// Released as <mcversion>-<semver> (e.g. 1.20.1-0.1.0), matching the ecosystem (see :replacements).
def full_version = "${minecraft_version}-${mod_version}".toString()
version = full_version
group = mod_group_id
base { archivesName = mod_id }

// Minimum :replacements (Palette Swap) release this build of mctfc requires. Bump this MANUALLY (not from
// :replacements' current version) whenever mctfc starts relying on a newer Palette Swap feature — it's the
// lower bound of the structurizereplacements dependency in mods.toml. Must carry the MC prefix to be a real
// bound, since with the <mcversion>-<semver> scheme a bare "[0.1,)" is satisfied by any 1.20.1-* version.
def replacements_min = "${minecraft_version}-0.1.0".toString()
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Register BOTH :replacements mixin configs in this run. In dev :replacements is loaded from a
            // source set (no jar MixinConfigs manifest), and MixinGradle only auto-registers THIS project's
            // own config — so without these the replacements mixins never apply when running the full stack
            // from :compat. The first is the core substitution config; the second is the optional
            // MineColonies-integration config (per-building choices, Build Options button).
            args '--mixin.config', 'structurizereplacements.mixins.json'
            args '--mixin.config', 'structurizereplacements.minecolonies.mixins.json'
            // Load BOTH our mods from their source sets. All third-party mods come from the
            // deobf dependencies on the runtime classpath.
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                structurizereplacements {
                    source project(':replacements').sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // The substitution engine (our standalone mod).
    implementation project(':replacements')

    // Full mod stack for the dev runtime. Declared explicitly so FML reliably finds every mod jar.
    // Structurize is compile-scope: the builder mixins reference Structurize types (Blueprint, etc.).
    implementation fg.deobf("com.ldtteam:structurize:${structurize_version}")
    // Compile-scope: the Build Options "Replace" button mixin references BlockUI types (ButtonImage, …).
    implementation fg.deobf("com.ldtteam:blockui:${blockui_version}")
    implementation fg.deobf("com.ldtteam:minecolonies:${minecolonies_version}")
    runtimeOnly fg.deobf("com.ldtteam:domum_ornamentum:${domum_ornamentum_version}")
    implementation fg.deobf("curse.maven:terrafirmacraft-302973:${tfc_file_id}")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:${patchouli_file_id}")
    // Dev-run-only: recipe/item viewer for testing (not a real dependency).
    runtimeOnly fg.deobf("curse.maven:emi-580555:${emi_file_id}")
    // Dev-run-only: Jade (block/entity info HUD) for inspecting blocks/citizens in-game.
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    // Dev-run-only: TFC Support Indicator (visualises TFC collapse-support coverage) — handy for testing the
    // build-area collapse-proofing.
    runtimeOnly fg.deobf("curse.maven:tfc-support-indicator-1195624:7700000")
    // Dev-run-only: Too Many Recipe Viewers (bundles JEI 15.x) — lets JEI run alongside EMI for cross-checking
    // recipe/usage and item discovery in-game.
    runtimeOnly fg.deobf("curse.maven:tmrv-1194921:8145843")
    // Beneath — added to test in-game whether its blocks are accessible (e.g. as substitution targets).
    implementation fg.deobf("curse.maven:beneath-1113980:7400831")
    // ArborFirmaCraft (TFC tree/wood addon) — optional; future substitutions + compat patches, gated on
    // ModList.isLoaded("afc") like Beneath. Stays an optional dependency (not mandatory in mods.toml).
    implementation fg.deobf("curse.maven:arborfirmacraft-877545:8071302")
    // FirmaLife (TFC food/farming/expansion addon) — optional; future substitutions + compat patches, gated on
    // ModList.isLoaded("firmalife") like Beneath. Stays an optional dependency (not mandatory in mods.toml).
    implementation fg.deobf("curse.maven:firmalife-453394:7602336")
}

// :compat mixins target MineColonies (per-building substitution choices for the builder). MineColonies
// integration belongs here, not in the standalone :replacements mod.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: full_version,
            mod_authors: mod_authors, mod_description: mod_description,
            replacements_min: replacements_min,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Cut a release in CHANGELOG.md: rename the curated '## [Unreleased]' section to a dated section for the
// current version (mod_version, e.g. 0.1.41) and leave a fresh empty '## [Unreleased]' on top. Run
// intentionally at release time (`./gradlew :compat:cutRelease`), then commit the changelog. Refuses when
// [Unreleased] is empty so we never stamp an empty release.
tasks.register('cutRelease') {
    group = 'release'
    description = "Move CHANGELOG [Unreleased] into a dated section for version ${mod_version}."
    doLast {
        def changelog = file('CHANGELOG.md')
        if (!changelog.exists()) {
            throw new GradleException("No CHANGELOG.md in ${projectDir}")
        }
        def text = changelog.text
        def marker = '## [Unreleased]'
        def idx = text.indexOf(marker)
        if (idx < 0) {
            throw new GradleException("No '${marker}' section in CHANGELOG.md")
        }
        def afterMarker = idx + marker.length()
        def nextHeader = text.indexOf('\n## [', afterMarker)
        def body = (nextHeader < 0 ? text.substring(afterMarker) : text.substring(afterMarker, nextHeader)).trim()
        if (body.isEmpty()) {
            throw new GradleException("CHANGELOG [Unreleased] is empty - nothing to release.")
        }
        def date = new Date().format('yyyy-MM-dd')
        changelog.text = text.substring(0, idx) + "${marker}\n\n## [${mod_version}] - ${date}" + text.substring(afterMarker)
        println "Cut ${mod_id} release ${mod_version} (${date}) in CHANGELOG.md"
    }
}
