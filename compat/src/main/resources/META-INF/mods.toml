modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# All mandatory: this is a compatibility layer and is useless without them.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# The block-substitution engine. Load AFTER it so its rules/datapack listener are available.
[[dependencies.${mod_id}]]
    modId="structurizereplacements"
    mandatory=true
    versionRange="[${replacements_min},)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecolonies"
    mandatory=true
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="tfc"
    mandatory=true
    versionRange="[3.0,)"
    ordering="AFTER"
    side="BOTH"
