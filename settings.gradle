pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'minecolonies-tfc'

// :replacements  - standalone Structurize block-substitution mod (no MineColonies/TFC dependency).
include 'replacements'

// :firmavanilla and :compat DELIBERATELY STAY on 1.20.1-Forge for now (decided 2026-08-05) — only
// :replacements moves to 1.21.1 at this stage. Their sources are still Forge/1.20.1 and would fail every
// Gradle invocation on this branch, so they're held out of the project tree; develop them on `main`.
// Re-include each here if and when it's ported (see docs/porting-1.21.1-neoforge.md).
// include 'firmavanilla'
// include 'compat'
