pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'minecolonies-tfc'

// :replacements  - standalone Structurize block-substitution mod (no MineColonies/TFC dependency).
// :firmavanilla  - standalone TFC-palette decorative blocks (vanilla building-block variants); TFC-only.
// :compat        - MineColonies x TerraFirmaCraft bridge; depends on :replacements + :firmavanilla, ships TFC rules.
include 'replacements'
include 'firmavanilla'
include 'compat'
